name: Build packages

# 触发：打 tag（正式发布）或手动运行（不发 Release，只出产物）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布为 GitHub Release（手动运行时勾选）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 清单闸门
  # install.sh 曾因"两份清单各自维护"长期漏装 3 个文件。这里在编译前就把
  # MANIFEST / Makefile / mesh-install.sh 三处清单比对一遍，不一致直接红。
  check:
    name: 文件清单一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 MANIFEST 与 Makefile、内置清单一致
        run: sh .github/scripts/check-manifest.sh

  # ---------------------------------------------------------------- 编译
  # ★ 包格式由 SDK 的 CONFIG_USE_APK 决定，不是开关：
  #   24.10 SDK 只能出 ipk，25.12 SDK 只能出 apk —— 所以是两条并行 SDK，
  #   不是同一 SDK 输出两种格式。
  # ★ 本包 LUCI_PKGARCH:=all（架构无关），一套 x86/64 SDK 覆盖全部设备架构，
  #   不需要多架构矩阵。
  build:
    name: 编译 ${{ matrix.format }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
            sdk_dir: releases/24.10.4
          - format: apk
            sdk_dir: releases/25.12
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          V=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          R=$(sed -n 's/^PKG_RELEASE:=//p' Makefile)
          [ -n "$V" ] && [ -n "$R" ] || { echo "无法从 Makefile 解析版本号"; exit 1; }
          echo "version=$V-r$R" >> "$GITHUB_OUTPUT"
          echo "版本号: $V-r$R"

      - name: 定位 SDK 下载地址
        id: sdk
        env:
          SDK_DIR: ${{ matrix.sdk_dir }}
        run: |
          base="https://downloads.openwrt.org/$SDK_DIR/targets/x86/64"
          file=$(curl -fsSL "$base/" | grep -o 'openwrt-sdk-[^"<>]*\.tar\.zst' | head -1 || true)
          if [ -z "$file" ]; then
            echo "::warning::$SDK_DIR 下没有 SDK，回退到 snapshot"
            base="https://downloads.openwrt.org/snapshots/targets/x86/64"
            file=$(curl -fsSL "$base/" | grep -o 'openwrt-sdk-[^"<>]*\.tar\.zst' | head -1 || true)
          fi
          [ -n "$file" ] || { echo "找不到 SDK"; exit 1; }
          echo "url=$base/$file" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: 缓存 SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/sdk.tar.zst
          key: sdk-${{ matrix.format }}-${{ steps.sdk.outputs.file }}

      - name: 下载 SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fsSL -o sdk.tar.zst "${{ steps.sdk.outputs.url }}"

      - name: 准备构建环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd rsync
          tar -I zstd -xf sdk.tar.zst

      - name: 拉 feeds
        run: |
          cd openwrt-sdk-*
          # ★ 不能只装 luci：LUCI_DEPENDS 里的 batctl / dawn / umdns 在 packages
          #   feed，luci-proto-batman-adv 在 routing feed。只装 luci 的话依赖
          #   不满足，defconfig 会把 CONFIG_PACKAGE_luci-app-mesh 整行丢掉，
          #   后面编译什么也不做，bin 里一个包都没有（失败得很安静）。
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 放入源码
        run: |
          cd openwrt-sdk-*
          mkdir -p package/luci-app-mesh
          # 排除 .git 与 SDK 自身，避免把几百 MB 垃圾拷进包目录
          rsync -a --exclude '.git' --exclude 'sdk.tar.zst' --exclude 'openwrt-sdk-*' \
                "$GITHUB_WORKSPACE"/ package/luci-app-mesh/

      - name: 生成 .config 并编译
        run: |
          cd openwrt-sdk-*
          # ★ 顺序不能反：CONFIG_PACKAGE_ 符号来自 tmp/.packageinfo，
          #   而它是 make 扫描 package/ 目录生成的 —— 源码必须先放进
          #   package/luci-app-mesh，再 defconfig，否则写进去的行会被当
          #   作未知符号丢掉，编译目标什么事都不做。
          # ★ SDK 包里没有 .config。toplevel.mk 的 `.config` 规则在文件缺失时
          #   会去执行 `make menuconfig`，而 CI 没有 tty，必然报
          #   "Error opening terminal: unknown" 然后整个 make 挂掉 ——
          #   这正是第一次跑挂掉的原因（日志末尾 menuconfig: Error 1）。
          #   所以必须先手工造一份 .config，让 toplevel.mk 认为它已存在。
          make defconfig
          # 选中本包；LUCI_PKGARCH:=all 所以不需要选 target/arch
          printf 'CONFIG_PACKAGE_luci-app-mesh=m\n' >> .config
          # 再跑一次：把 LUCI_DEPENDS 声明的依赖展开进 .config
          make defconfig
          grep -q 'CONFIG_PACKAGE_luci-app-mesh' .config \
            || echo "::warning::defconfig 没保留本包符号，多半是 LUCI_DEPENDS 有依赖在本 SDK 的 feeds 里找不到"

          make package/luci-app-mesh/compile V=s

      - name: 收集产物
        run: |
          # ★ 每个 run 都是独立 shell，工作目录会重置回 workspace 根，
          #   而产物在 SDK 目录里的 bin/ —— 这里必须自己指定路径。
          SDK=$(ls -d openwrt-sdk-*)
          mkdir -p out
          find "$SDK/bin" -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} out/ \;
          # 空产物要显式报错，否则会静默上传一个空 artifact 还显示绿
          if ! ls out/*.${{ matrix.format }} >/dev/null 2>&1; then
            echo "::error::没有产出任何 ${{ matrix.format }}，往上翻 defconfig 的依赖警告 / compile 日志"
            exit 1
          fi
          # 固定名副本：mesh-install.sh 用 .../releases/latest/download/<固定名>
          # 这种稳定 URL 取包，不必事先知道版本号
          # 注意：GitHub 的 run 默认走 `bash -e`，裸 `[ -f x ] && cp` 在匹配不到时
          # 会让整个 step 失败 —— 必须写成 if
          for f in out/*"${{ steps.ver.outputs.version }}"*.ipk; do
            if [ -f "$f" ]; then cp "$f" out/luci-app-mesh.ipk; fi
          done
          for f in out/*"${{ steps.ver.outputs.version }}"*.apk; do
            if [ -f "$f" ]; then cp "$f" out/luci-app-mesh.apk; fi
          done
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.format }}
          path: out/*

  # ---------------------------------------------------------------- 发布
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号并校验 tag
        id: ver
        run: |
          V=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          R=$(sed -n 's/^PKG_RELEASE:=//p' Makefile)
          echo "version=$V-r$R" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            TAG=${GITHUB_REF#refs/tags/}
            if [ "$TAG" != "v$V-r$R" ]; then
              echo "::error::tag $TAG 与 Makefile 的 $V-r$R 不一致（打 tag 前先改 PKG_RELEASE）"
              exit 1
            fi
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 打源码包并生成校验值
        run: |
          git archive --format=tar.gz --prefix=luci-app-mesh/ \
              -o dist/luci-app-mesh-src.tar.gz HEAD
          cp dist/luci-app-mesh-src.tar.gz dist/luci-app-mesh-src-${{ steps.ver.outputs.version }}.tar.gz
          cd dist
          sha256sum * > sha256sums.txt
          ls -l

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: luci-app-mesh v${{ steps.ver.outputs.version }}
          files: dist/*
          generate_release_notes: true
